name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build
        env:
          # Not secret — Vite inlines it into the public bundle. Set it as a
          # variable on the github-pages Environment (Settings → Environments →
          # github-pages → Environment variables). The `environment:` key above
          # is what scopes `vars.*` to that environment.
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist